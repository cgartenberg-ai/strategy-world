<!doctype html>
<meta charset="utf-8">
<title>Strategy world: the stages</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>html, body { margin: 0; background: #000; }</style>
<!-- A link straight to one section (e.g. from PowerPoint): /stages opens the app on the stages. Anything after a ? is
     passed on, e.g. /stages/?show=1 for show mode. -->
<script>
  const q = location.search ? '&' + location.search.slice(1) : '';
  location.replace('../?section=stages' + q);
</script>
<noscript><meta http-equiv="refresh" content="0; url=../?section=stages"></noscript>
